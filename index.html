<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Polyrhythmic Spiral</title>
		<link rel="stylesheet" href="style.css" />
		<script
			src="https://kit.fontawesome.com/3f7bb1cf2c.js"
			crossorigin="anonymous"
		></script>
	</head>
	<body>
		<div id="control-bar-wrapper">
			<div id="control-bar">
				<!-- <button
					id="sound-toggle"
					class="toggle"
					type="button"
					data-toggled="false"
					onClick="handleSoundToggle()"
					title="Toggle Pulse"
				>
					<i class="fa-solid fa-ban"></i>
					<i class="fa-solid fa-music on"></i>
				</button> -->
			</div>
		</div>

		<div id="background-image"></div>

		<div id="background-filter"></div>

		<div id="logo">
			<button
				id="sound-toggle"
				class="toggle"
				type="button"
				data-toggled="false"
				onClick="handleSoundToggle()"
				title="Toggle Pulse"
			>
				<i class="fa-solid fa-ban off"></i>
				<i class="fa-solid fa-music on"></i>
			</button>
		</div>

		<div id="sound-message">
			<p>Click anywhere to toggle sound</p>
		</div>

		<canvas id="paper"></canvas>
		<script src="script.js"></script>
	</body>
</html>
